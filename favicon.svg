<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bombBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a3342"/>
      <stop offset="50%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#07090d"/>
    </radialGradient>
    <linearGradient id="fuseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Bomb body -->
  <circle cx="30" cy="38" r="22" fill="url(#bombBody)" stroke="#00e5ff" stroke-width="1.5" />
  <circle cx="30" cy="38" r="19" fill="none" stroke="#252d3d" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Highlight -->
  <ellipse cx="23" cy="28" rx="6" ry="3.5" transform="rotate(-30 23 28)" fill="#ffffff" opacity="0.25"/>
  <!-- Bomb neck/cap -->
  <rect x="25" y="12" width="10" height="6" rx="2" fill="#3a4454" stroke="#00e5ff" stroke-width="1"/>
  <!-- Fuse -->
  <path d="M 30 12 Q 32 4 44 8 Q 50 10 52 4" fill="none" stroke="#d49033" stroke-width="3" stroke-linecap="round"/>
  <!-- Spark -->
  <circle cx="52" cy="4" r="4" fill="#ffef5c" filter="url(#glow)"/>
  <polygon points="52,0 54,3 58,4 54,5 52,8 50,5 46,4 50,3" fill="#ff3b30"/>
  <!-- Warning icon on bomb -->
  <polygon points="30,27 38,41 22,41" fill="#ffb020" opacity="0.9"/>
  <circle cx="30" cy="39" r="1" fill="#000"/>
  <line x1="30" y1="31" x2="30" y2="36" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
