<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <radialGradient id="bombBody192" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#343e52"/>
      <stop offset="45%" stop-color="#171c26"/>
      <stop offset="100%" stop-color="#090b10"/>
    </radialGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="36" fill="url(#bgGlow)" stroke="#1f2738" stroke-width="2"/>
  
  <!-- Bomb body -->
  <circle cx="92" cy="115" r="58" fill="url(#bombBody192)" stroke="#00e5ff" stroke-width="3.5" filter="drop-shadow(0 8px 24px rgba(0,229,255,0.25))" />
  <circle cx="92" cy="115" r="50" fill="none" stroke="#252d3d" stroke-width="2" stroke-dasharray="6,6"/>
  
  <!-- Specular highlight -->
  <ellipse cx="72" cy="88" rx="16" ry="9" transform="rotate(-30 72 88)" fill="#ffffff" opacity="0.2"/>
  
  <!-- Bomb neck/cap -->
  <rect x="78" y="44" width="28" height="16" rx="4" fill="#3a4454" stroke="#00e5ff" stroke-width="2"/>
  
  <!-- Fuse -->
  <path d="M 92 44 Q 96 22 130 32 Q 148 38 154 20" fill="none" stroke="#d49033" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Spark -->
  <circle cx="154" cy="20" r="10" fill="#ffef5c" filter="url(#glow192)"/>
  <polygon points="154,8 160,18 172,20 160,24 154,34 148,24 136,20 148,18" fill="#ff3b30" filter="url(#glow192)"/>
  
  <!-- Hazard triangle on bomb -->
  <polygon points="92,86 114,124 70,124" fill="#ffb020" opacity="0.95"/>
  <circle cx="92" cy="118" r="3" fill="#090b10"/>
  <line x1="92" y1="96" x2="92" y2="110" stroke="#090b10" stroke-width="4.5" stroke-linecap="round"/>
</svg>
