<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182235"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <radialGradient id="bombBody512" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3c485f"/>
      <stop offset="45%" stop-color="#19202c"/>
      <stop offset="100%" stop-color="#090b10"/>
    </radialGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" fill="url(#bgGlow512)" stroke="#222c3f" stroke-width="4"/>
  
  <!-- Bomb body -->
  <circle cx="245" cy="305" r="155" fill="url(#bombBody512)" stroke="#00e5ff" stroke-width="9" filter="drop-shadow(0 20px 60px rgba(0,229,255,0.3))" />
  <circle cx="245" cy="305" r="135" fill="none" stroke="#252d3d" stroke-width="5" stroke-dasharray="14,14"/>
  
  <!-- Specular highlight -->
  <ellipse cx="190" cy="235" rx="42" ry="24" transform="rotate(-30 190 235)" fill="#ffffff" opacity="0.22"/>
  
  <!-- Bomb neck/cap -->
  <rect x="208" y="115" width="74" height="42" rx="10" fill="#3a4454" stroke="#00e5ff" stroke-width="5"/>
  
  <!-- Fuse -->
  <path d="M 245 115 Q 255 58 346 84 Q 394 100 410 52" fill="none" stroke="#d49033" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Spark -->
  <circle cx="410" cy="52" r="26" fill="#ffef5c" filter="url(#glow512)"/>
  <polygon points="410,20 426,46 458,52 426,62 410,88 394,62 362,52 394,46" fill="#ff3b30" filter="url(#glow512)"/>
  
  <!-- Hazard triangle on bomb -->
  <polygon points="245,230 305,330 185,330" fill="#ffb020" opacity="0.95"/>
  <circle cx="245" cy="314" r="8" fill="#090b10"/>
  <line x1="245" y1="256" x2="245" y2="294" stroke="#090b10" stroke-width="12" stroke-linecap="round"/>
</svg>
